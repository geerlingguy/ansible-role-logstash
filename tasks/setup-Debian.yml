---
- name: Ensure required dependencies are installed.
  apt:
    name:
      - apt-transport-https
      - gnupg2
    state: present

- name: Add elasticsearch repo
  ansible.builtin.deb822_repository:
    name: elasticsearch
    types: deb
    uris: "{{logstash_apt_base_url_elasticsearch}}/{{ logstash_version }}/apt"
    components: main
    suites: stable
    state: present
    architectures: amd64
    enabled: true
    signed_by: "{{ logstash_apt_url_elasticsearch_pubkey }}"

- name: Install Logstash.
  apt:
    name: '{{ logstash_package }}'
    state: present

- name: Add Logstash user to adm group (Debian).
  user:
    name: logstash
    group: logstash
    groups: adm
  notify: restart logstash
